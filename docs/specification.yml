                          - 'gln'
                      purchaseDate:
                        type: 'string'
                      purchasePrice:
                        type: 'object'
                        properties:
                          amount:
                            type: 'integer'
                          currency:
                            type: 'string'
                        required:
                          - 'amount'
                          - 'currency'
                      warranty:
                        type: 'object'
                        properties:
                          type:
                            type: 'string'
                          status:
                            type: 'string'
                          startDate:
                            type: 'string'
                          endDate:
                            type: 'string'
                          durationMonths:
                            type: 'integer'
                        required:
                          - 'type'
                          - 'status'
                          - 'startDate'
                          - 'endDate'
                          - 'durationMonths'
                    required:
                      - 'retailer'
                      - 'purchaseDate'
                      - 'purchasePrice'
                      - 'warranty'
                  sustainability:
                    type: 'object'
