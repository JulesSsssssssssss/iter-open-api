                  consumer:
                    type: 'object'
                    properties:
                      name:
                        type: 'string'
                      email:
                        type: 'string'
                    required:
                      - 'name'
                      - 'email'
                  links:
                    type: 'object'
                    properties:
                      self:
                        type: 'string'
                      jsonld:
                        type: 'string'
                      ttl:
                        type: 'string'
                      public:
                        type: 'string'
                      oauth:
                        type: 'string'
                    required:
                      - 'self'
                      - 'jsonld'
                      - 'ttl'
                      - 'public'
                      - 'oauth'
