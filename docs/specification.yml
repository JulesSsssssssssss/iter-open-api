openapi: 3.0.0
info:
  title: ITER open data
  description: Documentation relative to the open part of ITER's digital product passport APIs.
  version: 0.0.1
servers:
  - url: http://api.example.com/v1
    description: Current production server for ITER open dpp api
paths:
  /api/dpp/{gtin}:
    get:
      summary: 'Get passport'
      description: 'Retrieve a passport'
      parameters:
        - in: path
          name: gtin
          required: true
          schema: { type: string, example: '884993074531' }
        - in: query
          name: serial
          required: false
          schema: { type: string, example: 'PAT-2025-BSW-1234' }
      responses:
        200:
          description: 'Successful response'
          content:
            application/json:
              schema:
                type: 'object'
                properties:
                  passportId:
                    type: 'string'
                  product:
                    type: 'object'
                    properties:
                      name:
                        type: 'string'
                      title:
                        type: 'object'
                        properties:
                          en:
                            type: 'string'
                          fr:
                            type: 'string'
                        required:
                          - 'en'
                          - 'fr'
                      description:
                        type: 'object'
                        properties:
                          en:
                            type: 'string'
                          fr:
                            type: 'string'
                        required:
                          - 'en'
                          - 'fr'
                      brand:
                        type: 'string'
                      sku:
                        type: 'string'
                      gtin:
                        type: 'string'
                      digitalLink:
                        type: 'string'
                      granularityLevel:
                        type: 'string'
                      serialNumber:
                        type: 'string'
                      color:
                        type: 'string'
                      size:
                        type: 'string'
                    required:
                      - 'name'
                      - 'title'
                      - 'description'
                      - 'brand'
                      - 'sku'
                      - 'gtin'
                      - 'digitalLink'
                      - 'granularityLevel'
                      - 'serialNumber'
                      - 'color'
                      - 'size'
                  manufacturing:
                    type: 'object'
                    properties:
                      date:
                        type: 'string'
                      location:
                        type: 'string'
                      manufacturer:
                        type: 'object'
                        properties:
                          name:
                            type: 'string'
                          url:
                            type: 'string'
                          gln:
                            type: 'string'
                          address:
                            type: 'object'
                            properties:
                              locality:
                                type: 'string'
                              region:
                                type: 'string'
                              country:
                                type: 'string'
                            required:
                              - 'locality'
                              - 'region'
                              - 'country'
                        required:
                          - 'name'
                          - 'url'
                          - 'gln'
                          - 'address'
                    required:
                      - 'date'
                      - 'location'
                      - 'manufacturer'
                  commercial:
                    type: 'object'
                    properties:
                      retailer:
                        type: 'object'
                        properties:
                          name:
                            type: 'string'
                          url:
                            type: 'string'
                          gln:
                            type: 'string'
                        required:
                          - 'name'
