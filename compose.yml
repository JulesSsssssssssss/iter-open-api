services:
  swagger-ui:
    image: docker.swagger.io/swaggerapi/swagger-ui:latest
    container_name: iter_swagger_ui
    # depends_on:
    #   open-dpp-api:
    #     condition: service_healthy
    environment:
      SWAGGER_JSON: /swagger-ui/specification.yml
    ports:
      - 81:8080
    networks:
      - public_network
    volumes:
      - ./open-api/docs/specification.yml:/swagger-ui/specification.yml

  open-dpp-api:
    build: ./open-api
    container_name: open_dpp_api
    ports:
      - 80:7000
    networks:
      - internal_network
      - public_network
    depends_on:
      open-dpp-db:
        condition: service_healthy

  open-dpp-db:
    image: postgres:18
    restart: unless-stopped
    container_name: open_dpp_db
    environment:
      POSTGRES_USER: user-iter-open
      POSTGRES_PASSWORD: ***REMOVED-LEAKED-SECRET***
      POSTGRES_DB: db-iter-open
      DB_ENV: dev
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d
      - open_dpp_pg:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U user-iter-open -d db-iter-open']
      interval: 5s
      timeout: 5s
      retries: 5

# Compose networks
networks:
  internal_network:
    driver: bridge
  public_network:
    external: true

# Compose volumes
volumes:
  open_dpp_pg:
